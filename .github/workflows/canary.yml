# Live canary: a few real requests to stats.nba.com and cdn.nba.com, always
# through the proxy in the NBA_API_PROXY secret (tests/integration/canary).
#
# Runs three ways:
#   - weekly, against the default branch (canary-report.yml opens an issue when
#     a scheduled run fails and closes it when a run passes)
#   - on demand (workflow_dispatch)
#   - as a gate inside release.yml, against the release tag, before publishing
#
# The secret lives in the `release` environment, which must be limited to the
# `master` branch: both the weekly run and release.yml run from there. One-time
# setup is in RELEASING.md.
# canary-report.yml matches this name; rename both together.
name: Canary

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays, 13:17 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (empty = the default branch)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Release gates (inputs.ref set) get their own group; scheduled and manual runs share one.
concurrency:
  group: canary-${{ inputs.ref || 'default' }}
  cancel-in-progress: false

env:
  # Matches the uv that generated uv.lock (see ci.yml).
  UV_VERSION: "0.13.4"
  UV_PYTHON_DOWNLOADS: never

jobs:
  canary:
    name: Live canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    env:
      NBA_API_REQUIRE_PROXY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --locked
      # Actions only masks the exact secret string; also mask the pieces a
      # traceback could print on their own (decoded user/password, proxy host).
      # This repo is public, so run logs are world-readable.
      - name: Mask derived proxy credentials
        env:
          NBA_API_PROXY: ${{ secrets.NBA_API_PROXY }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlsplit

          parts = urlsplit(os.environ.get("NBA_API_PROXY", ""))
          values = [parts.username, parts.password, parts.hostname]
          if parts.hostname and parts.port:
              values.append(f"{parts.hostname}:{parts.port}")
          for value in values:
              if value:
                  for form in {value, unquote(value)}:
                      print(f"::add-mask::{form}")
          PY
      # Proxy IPs are occasionally blocked by NBA.com, so retry once before failing.
      - name: Run canary tests
        env:
          NBA_API_PROXY: ${{ secrets.NBA_API_PROXY }}
        run: |
          # Quiet output: one-line failures plus a pass/fail summary per test.
          run() { uv run --no-sync pytest tests/integration/canary -m canary -q --tb=line -rA --record-mode=none -p no:cacheprovider; }
          run || {
            echo "::warning::Canary failed once; retrying in 60s"
            sleep 60
            run
          }
