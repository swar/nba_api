# Keep one open issue in sync with the weekly canary: open it (or comment on it)
# when a scheduled run fails, and close it when a scheduled run passes again.
#
# A separate workflow rather than a job in canary.yml, because release.yml calls
# canary.yml and a called workflow can't ask for more permissions than its caller.
# It never sees the proxy secret and never copies run logs: the issue only links
# to the run.
name: Canary report

on:
  workflow_run:
    workflows: [Canary]
    types: [completed]

permissions:
  issues: write

jobs:
  report:
    name: Update canary issue
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      TITLE: "Weekly live canary is failing"
    steps:
      - name: Open, update, or close the canary issue
        run: |
          number="$(gh issue list --state open --search "\"${TITLE}\" in:title" \
            --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)"

          if [ "$CONCLUSION" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Scheduled canary passed again: ${RUN_URL}"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: ${RUN_URL}"
          else
            body="$(mktemp)"
            cat > "$body" <<EOF
          The scheduled live canary (\`.github/workflows/canary.yml\`) failed: ${RUN_URL}

          That means stats.nba.com or cdn.nba.com stopped answering the way \`tests/integration/canary\` expects, or the proxy in the \`release\` environment is blocked. Until it passes, the canary gate in \`release.yml\` will block PyPI publishes too.

          This issue is updated on each failed scheduled run and closed by the next passing one. Do not paste proxy URLs or raw logs here.
          EOF
            gh issue create --title "$TITLE" --body-file "$body"
          fi
