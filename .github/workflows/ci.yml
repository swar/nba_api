name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale PR runs; never cancel a run on master.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Matches the uv that generated uv.lock.
  UV_VERSION: "0.13.4"
  # setup-python provides the interpreters; uv must not fetch its own.
  UV_PYTHON_DOWNLOADS: never
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv.lock is in sync with pyproject.toml
        run: uv lock --check
      # Only the lint group (ruff), not the project or its runtime dependencies.
      - name: ruff check
        run: uv run --locked --only-group lint ruff check --output-format=github
      - name: ruff format --check
        run: uv run --locked --only-group lint ruff format --check

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"
      # --block-network fails any test that opens a real socket, and
      # --record-mode=none stops VCR from recording a missing cassette.
      - name: Unit tests
        run: uv run --no-sync pytest tests/unit --block-network --record-mode=none
      - name: Integration tests (VCR cassette replay)
        # A proxy would intercept cassette replay; keep it blank in CI.
        env:
          NBA_API_PROXY: ""
        run: uv run --no-sync pytest tests/integration -m vcr --block-network --record-mode=none

  # The matrix above tests the locked versions; this tests the lowest pandas
  # and requests that pyproject.toml allows on each Python. The floors
  # differ per Python (see the markers in pyproject.toml), so it is a matrix too.
  test-min-deps:
    name: Tests (Python ${{ matrix.python-version }}, minimum dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          # Its own cache, so this job's downgraded wheels never land in the test job's.
          cache-suffix: min-deps
      # Re-resolves every direct dependency to its lowest allowed version for this
      # Python (the floors differ per Python, see the markers in pyproject.toml).
      # That includes the dev tools (pytest, pytest-recording, ...), so a dev floor
      # that stops working also fails this job.
      # Wheels only for numpy and pandas: a floor with no wheel for this Python
      # means users would have to build from source, so it should fail here.
      # uv.lock is rewritten in this checkout only, never committed.
      - name: Install the lowest direct dependencies
        run: |
          uv sync --python "${{ matrix.python-version }}" --resolution lowest-direct \
            --no-build-package numpy --no-build-package pandas
          uv pip check
      - name: Unit tests
        run: uv run --no-sync pytest tests/unit --block-network --record-mode=none
      - name: Integration tests (VCR cassette replay)
        env:
          NBA_API_PROXY: ""
        run: uv run --no-sync pytest tests/integration -m vcr --block-network --record-mode=none

  # The tests run against the source tree; this checks what ships to PyPI.
  package:
    name: Package (build, twine check, import wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Build, check, and import the wheel
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: scripts/check-package.sh "$PYTHON"

  # Single check for branch protection to require, so adding or renaming
  # jobs and matrix entries never means editing the protection rules.
  all-green:
    name: CI passed
    if: always()
    needs: [lint, test, test-min-deps, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
