# Replacement for the `release` job in .circleci/config.yml.
#
# The CircleCI job runs `semantic-release publish`, which in python-semantic-release
# v9 only uploads dist/* to the latest GitHub release. It never builds, so dist/ is
# empty and nothing is uploaded; `upload_to_pypi` is a v7 setting that v9 ignores.
#
# This workflow publishes from CI instead. It starts automatically, and only, when
# a release commit lands on master: a commit titled `chore: release vX.Y.Z` (the
# squash-merge of the release PR from scripts/gen-release.sh) whose parent had a
# different `pyproject.toml` version, with the new version equal to X.Y.Z. Any other
# push touching pyproject.toml exits in `prepare` without building anything.
#
# Pipeline: prepare -> build -> live canary (pypi only) -> publish (pypi environment
# approval) -> tag + GitHub release. It can also be run by hand (workflow_dispatch)
# for an existing tag, e.g. to re-run a failed publish or rehearse on testpypi.
#
# One-time setup is in RELEASING.md.
name: Release

on:
  push:
    branches: [master]
    paths: [pyproject.toml]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (e.g. v1.11.5)"
        required: true
        type: string
      target:
        description: "Package index to publish to"
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      skip_canary:
        description: "Skip the live canary gate when publishing to pypi (escape hatch for a blocked proxy; leave off normally)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  POETRY_VERSION: "2.3.2"

jobs:
  prepare:
    name: Detect release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
      tag: ${{ steps.detect.outputs.tag }}
      target: ${{ steps.detect.outputs.target }}
      ref: ${{ steps.detect.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Decide whether this is a release
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::Not a release: $1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          version_of() { python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])'; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            {
              echo "run=true"
              echo "tag=${INPUT_TAG}"
              echo "target=${INPUT_TARGET}"
              echo "ref=refs/tags/${INPUT_TAG}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject="$(git log -1 --format=%s "$SHA")"
          re='^chore: release v([0-9]+\.[0-9]+\.[0-9]+)( \(#[0-9]+\))?$'
          [[ "$subject" =~ $re ]] || skip "commit subject '${subject}' is not 'chore: release vX.Y.Z'"
          version="${BASH_REMATCH[1]}"

          new="$(git show "${SHA}:pyproject.toml" | version_of)"
          old="$(git show "${SHA}^:pyproject.toml" | version_of)"
          [ "$new" = "$version" ] || skip "pyproject.toml is ${new} but the commit says ${version}"
          [ "$new" != "$old" ] || skip "pyproject.toml version did not change (still ${old})"

          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            skip "tag v${version} already exists"
          fi

          {
            echo "run=true"
            echo "tag=v${version}"
            echo "target=pypi"
            echo "ref=${SHA}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build distributions
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check tag matches pyproject version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version="$(poetry version --short)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject.toml version ${version}"
            exit 1
          fi
      - name: Build
        run: poetry build --no-ansi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  canary:
    name: Live canary
    needs: [prepare, build]
    if: needs.prepare.outputs.target == 'pypi' && !inputs.skip_canary
    permissions:
      contents: read
    uses: ./.github/workflows/canary.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  publish:
    name: Publish to ${{ needs.prepare.outputs.target }}
    needs: [prepare, build, canary]
    # A skipped canary (testpypi, or skip_canary) is fine; a failed one blocks the publish.
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.canary.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.prepare.outputs.target }}
      url: ${{ needs.prepare.outputs.target == 'pypi' && 'https://pypi.org/project/nba_api/' || 'https://test.pypi.org/project/nba_api/' }}
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ needs.prepare.outputs.target == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  github-release:
    name: Tag and GitHub release
    needs: [prepare, publish]
    if: needs.prepare.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Creates the tag on the released commit if needed (the push path has no tag yet);
      # for a manual run on an existing release it just uploads the files.
      - name: Create the release (if missing) and upload files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ github.sha }}
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target="$SHA"
            case "$REF" in refs/tags/*) target="$(git rev-parse "$REF^{commit}")" ;; esac
            awk -v v="$TAG" '$0 == "## " v {on=1; next} on && /^## / {exit} on' CHANGELOG.MD > notes.md
            [ -s notes.md ] || { echo "::error::No '## ${TAG}' section in CHANGELOG.MD"; exit 1; }
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$target" --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
