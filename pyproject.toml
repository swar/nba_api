[project]
name = "nba_api"
version = "1.12.0"
description = "An API Client package to access the APIs for NBA.com"
requires-python = ">=3.10"
license = "MIT"
authors = [ {name = "Swar Patel", email = "<swar.m.patel@gmail.com>"}]
maintainers = [
    {name = "Swar Patel", email = "<swar.m.patel@gmail.com>"},
]
keywords = [
    "api", 
    "basketball", 
    "data", 
    "nba", 
    "sports", 
    "stats"
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "pandas >=2.2.2 ; python_version < '3.12'",
    "pandas >=2.2.2 ; python_version == '3.12'",
    "pandas >=2.2.3 ; python_version == '3.13'",
    "pandas >=2.3.3 ; python_version == '3.14'",
    "pandas >=3.0.6 ; python_version >= '3.15'",
    "requests (>=2.32.3,<3.0.0)"
]

readme = "README.md"

[project.urls]
    repository = "https://github.com/swar/nba_api"
    "Bug Tracker" = "https://github.com/swar/nba_api/issues"
    documentation = "https://github.com/swar/nba_api/blob/master/docs/table_of_contents.md"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.1"
python-semantic-release = "^10.3.1"
pandas = ">=2.2.2"
ruff = "^0.17.2"
pre-commit = "^4.0.0"
pytest-recording = "^0.14.0"
requests = {version = "^2.32.3", extras = ["socks"]}

[tool.pytest.ini_options]
markers = [
    "live: test makes real HTTP requests to the NBA Stats API; skip in CI unless cassettes are present",
    "vcr: test uses a pre-recorded VCR cassette and does not require network access",
    "canary: lightweight live check of a few endpoints through the proxy (see tests/integration/canary); never runs in the default CI jobs",
    "deprecated_endpoint: marks a test for an endpoint known to be deprecated or unstable",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernize syntax for target Python version)
    "B",   # flake8-bugbear (common bugs and design issues)
    "C4",  # flake8-comprehensions (simplify comprehensions)
    "SIM", # flake8-simplify (simplify code patterns)
]
ignore = [
    "E501", # line too long — handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # re-exports are intentional in __init__.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
# Ruff 0.17 formats code blocks in Markdown. Leave the docs alone: their examples
# use hand-aligned comments that the formatter would collapse.
exclude = ["*.md", "*.MD"]

# semantic-release only computes the next version from commit messages
# (scripts/gen-release.sh). CHANGELOG.MD is written by hand, and publishing is
# .github/workflows/release.yml. See RELEASING.md.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore: release v{version}"
tag_format = "v{version}"

[tool.semantic_release.remote]
type = "github"
token = { env = "GITHUB_TOKEN" }

[tool.semantic_release.branches.master]
match = "(master|main)"
prerelease = false

[tool.semantic_release.branches.release]
match = "(release|release/.*)"
prerelease = false

[tool.semantic_release.branches.test]
match = "test-release"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

# The default ("init") mode regenerates the whole file from git history, which
# would wipe the hand-written changelog. "update" mode only writes at
# insertion_flag, and CHANGELOG.MD never contains it, so a stray
# `semantic-release version` leaves the file alone.
[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- semantic-release: not used, CHANGELOG.MD is hand-written -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.MD"